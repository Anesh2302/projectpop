<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ProjectPop{% endblock %} — Security Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:#1e293b;--text:#e2e8f0;--muted:#64748b;--accent:#00d4ff;--green:#22c55e;--red:#ef4444;--gold:#f59e0b;--purple:#a855f7;--orange:#f97316}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{color:var(--accent);text-decoration:none}
    .flash{padding:12px 20px;border-radius:10px;margin-bottom:16px;font-size:.8rem;font-weight:500}
    .flash-success{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
    .flash-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
    .flash-warning{background:rgba(245,158,11,.15);color:var(--gold);border:1px solid rgba(245,158,11,.3)}
    .flash-info{background:rgba(0,212,255,.15);color:var(--accent);border:1px solid rgba(0,212,255,.3)}
    .btn{padding:10px 20px;border-radius:10px;border:none;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
    .btn-green{background:var(--green);color:#000}.btn-green:hover{background:#16a34a}
    .btn-accent{background:var(--accent);color:#000}.btn-accent:hover{background:#00b8d4}
    .btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#dc2626}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
    .btn-sm{padding:6px 12px;font-size:.7rem}
    .btn-gold{background:var(--gold);color:#000}.btn-gold:hover{background:#d97706}
    input,select{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.8rem;font-family:'Inter',sans-serif;outline:none;width:100%}
    input:focus{border-color:var(--accent)}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:6px}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
