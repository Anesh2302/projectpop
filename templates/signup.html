{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="width:100%;max-width:400px">
    <div style="text-align:center;margin-bottom:30px">
      <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--accent));display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:#000;margin-bottom:12px">PP</div>
      <h1 style="font-size:1.4rem;font-weight:800">Create Account</h1>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{cat}}">{{msg}}</div>
      {% endfor %}
    {% endwith %}
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px">
      <form method="POST">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Anesh G J" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn btn-green" style="width:100%;padding:12px;margin-top:8px">Create Account</button>
      </form>
      <p style="text-align:center;margin-top:16px;font-size:.75rem;color:var(--muted)">
        Already have an account? <a href="{{url_for('login')}}">Sign In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
